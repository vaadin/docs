<svg xmlns="http://www.w3.org/2000/svg" width="1832" height="1002" viewBox="0 0 1832 1002" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source of application-layer-api.png. After editing, regenerate the PNG from this directory with:
       rsvg-convert -w 1832 application-layer-api.svg -o application-layer-api.png -->
  <defs>
    <marker id="grey" markerUnits="userSpaceOnUse" viewBox="-30 -30 34 60" markerWidth="34" markerHeight="60" orient="auto">
      <path d="M-26,-26 L0,0 L-26,26" fill="none" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- The dashed borders have one path per side, from corner to corner, with a dash pattern that fits each
       side a whole number of times. Each side starts and ends with half a dash, so every corner is covered. -->

  <!-- Presentation Layer -->
  <rect x="260" y="260" width="256" height="480" rx="12" fill="#BDE3FF"/>
  <g fill="none" stroke="#22B3FF" stroke-width="8" stroke-linecap="round">
    <path d="M263.51,263.51 A12,12 0 0 1 272,260 H504 A12,12 0 0 1 512.49,263.51" stroke-dasharray="42.71 20" stroke-dashoffset="21.36"/>
    <path d="M512.49,263.51 A12,12 0 0 1 516,272 V728 A12,12 0 0 1 512.49,736.49" stroke-dasharray="32.76 20" stroke-dashoffset="16.38"/>
    <path d="M512.49,736.49 A12,12 0 0 1 504,740 H272 A12,12 0 0 1 263.51,736.49" stroke-dasharray="42.71 20" stroke-dashoffset="21.36"/>
    <path d="M263.51,736.49 A12,12 0 0 1 260,728 V272 A12,12 0 0 1 263.51,263.51" stroke-dasharray="32.76 20" stroke-dashoffset="16.38"/>
  </g>
  <text x="388" y="490" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">Presentation</text>
  <text x="388" y="538" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">Layer</text>

  <!-- Application Layer -->
  <rect x="804" y="260" width="768" height="480" rx="12" fill="#AFF4C6"/>
  <g fill="none" stroke="#65BF8C" stroke-width="8" stroke-linecap="round">
    <path d="M807.51,263.51 A12,12 0 0 1 816,260 H1560 A12,12 0 0 1 1568.49,263.51" stroke-dasharray="34.49 20" stroke-dashoffset="17.24"/>
    <path d="M1568.49,263.51 A12,12 0 0 1 1572,272 V728 A12,12 0 0 1 1568.49,736.49" stroke-dasharray="32.76 20" stroke-dashoffset="16.38"/>
    <path d="M1568.49,736.49 A12,12 0 0 1 1560,740 H816 A12,12 0 0 1 807.51,736.49" stroke-dasharray="34.49 20" stroke-dashoffset="17.24"/>
    <path d="M807.51,736.49 A12,12 0 0 1 804,728 V272 A12,12 0 0 1 807.51,263.51" stroke-dasharray="32.76 20" stroke-dashoffset="16.38"/>
  </g>
  <text x="1188" y="513" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">Application Layer</text>

  <rect x="676" y="366" width="256" height="272" rx="12" fill="#14AE5C" stroke="#006437" stroke-width="8"/>
  <text x="804" y="514" font-size="32" text-anchor="middle" fill="#FFFFFF">API</text>

  <!-- Arrow -->
  <line x1="532" y1="502" x2="659" y2="502" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" marker-end="url(#grey)"/>
</svg>
