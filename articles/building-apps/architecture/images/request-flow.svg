<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="700" viewBox="0 0 2000 700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source of request-flow.png. After editing, regenerate the PNG from this directory with:
       rsvg-convert -w 2000 request-flow.svg -o request-flow.png -->
  <defs>
    <marker id="blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1E96F0" stroke-width="2"/>
    </marker>
    <marker id="dark" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#222222" stroke-width="2"/>
    </marker>
  </defs>


  <!-- Browser -->
  <rect x="40" y="40" width="700" height="620" rx="14" fill="#E6E6E6" stroke="#C4C4C4" stroke-width="6"/>
  <text x="390" y="88" font-size="30" text-anchor="middle" fill="#222222">Browser</text>

  <rect x="90" y="220" width="250" height="330" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="215" y="375" font-size="27" text-anchor="middle" fill="#FFFFFF">&lt;vaadin-button&gt;</text>
  <text x="215" y="411" font-size="27" text-anchor="middle" fill="#FFFFFF">in the DOM</text>

  <rect x="440" y="220" width="250" height="330" rx="6" fill="#AAAAAA" stroke="#7A7A7A" stroke-width="6"/>
  <text x="565" y="375" font-size="28" text-anchor="middle" fill="#222222">Flow client</text>
  <text x="565" y="411" font-size="28" text-anchor="middle" fill="#222222">engine</text>

  <!-- Server -->
  <rect x="780" y="40" width="1180" height="620" rx="14" fill="#B3B3B3" stroke="#7F7F7F" stroke-width="6"/>
  <text x="1370" y="88" font-size="30" text-anchor="middle" fill="#222222">Server</text>

  <rect x="820" y="120" width="700" height="500" rx="10" fill="#C9E3F6" stroke="#5BC2F7" stroke-width="6"/>
  <text x="1170" y="166" font-size="30" text-anchor="middle" fill="#222222">VaadinSession (one per user)</text>

  <rect x="860" y="200" width="620" height="350" rx="8" fill="#A6D3F5" stroke="#2E9BEA" stroke-width="5"/>
  <text x="1170" y="244" font-size="28" text-anchor="middle" fill="#222222">UI (one per browser tab)</text>

  <rect x="900" y="285" width="540" height="90" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="1170" y="340" font-size="28" text-anchor="middle" fill="#FFFFFF">Button and its click listener</text>

  <rect x="900" y="430" width="540" height="90" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="1170" y="485" font-size="28" text-anchor="middle" fill="#FFFFFF">Changed components</text>

  <text x="1170" y="593" font-size="25" text-anchor="middle" fill="#222222">Session lock held from step 2 to step 4</text>

  <rect x="1560" y="120" width="360" height="500" rx="10" fill="#17B05C" stroke="#0D6B38" stroke-width="6"/>
  <text x="1740" y="166" font-size="30" text-anchor="middle" fill="#0B2E19">Application Layer</text>

  <rect x="1600" y="285" width="280" height="90" rx="6" fill="#ADF5C8" stroke="#5EC98A" stroke-width="6"/>
  <text x="1740" y="340" font-size="28" text-anchor="middle" fill="#222222">Service</text>

  <!-- Arrows -->
  <line x1="343" y1="330" x2="432" y2="330" stroke="#1E96F0" stroke-width="5" marker-end="url(#blue)"/>
  <line x1="693" y1="330" x2="892" y2="330" stroke="#1E96F0" stroke-width="5" marker-end="url(#blue)"/>
  <line x1="1443" y1="330" x2="1592" y2="330" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>
  <line x1="1170" y1="378" x2="1170" y2="422" stroke="#1E96F0" stroke-width="5" marker-end="url(#blue)"/>
  <line x1="897" y1="475" x2="698" y2="475" stroke="#1E96F0" stroke-width="5" marker-end="url(#blue)"/>
  <line x1="437" y1="475" x2="348" y2="475" stroke="#1E96F0" stroke-width="5" marker-end="url(#blue)"/>

  <!-- Step numbers -->
  <g font-size="24" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    <circle cx="390" cy="288" r="22" fill="#222222"/>
    <text x="390" y="296">1</text>
    <circle cx="795" cy="288" r="22" fill="#222222"/>
    <text x="795" y="296">2</text>
    <circle cx="1520" cy="288" r="22" fill="#222222"/>
    <text x="1520" y="296">3</text>
    <circle cx="795" cy="517" r="22" fill="#222222"/>
    <text x="795" y="525">4</text>
    <circle cx="390" cy="517" r="22" fill="#222222"/>
    <text x="390" y="525">5</text>
  </g>
</svg>
