<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1400" viewBox="0 0 1160 1400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source of combined-spi-api.png. After editing, regenerate the PNG from this directory with:
       rsvg-convert -w 1160 combined-spi-api.svg -o combined-spi-api.png -->
  <defs>
    <marker id="grey" markerUnits="userSpaceOnUse" viewBox="-22 -22 26 44" markerWidth="26" markerHeight="44" orient="auto">
      <path d="M-18,-18 L0,0 L-18,18" fill="none" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="grey-filled" markerUnits="userSpaceOnUse" viewBox="-22 -16 26 32" markerWidth="26" markerHeight="32" orient="auto">
      <path d="M0,0 L-18,-12 L-18,12 Z" fill="#B3B3B3" stroke="#B3B3B3" stroke-width="8" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Services -->
  <rect x="260" y="260" width="448" height="240" rx="12" fill="#AFF4C6" stroke="#65BF8C" stroke-width="8"/>
  <text x="484" y="392" font-size="32" font-weight="bold" text-anchor="middle" fill="#000000" fill-opacity="0.8">Services</text>

  <!-- Domain Model -->
  <rect x="260" y="580" width="448" height="240" rx="12" fill="#FCD19C" stroke="#D2992F" stroke-width="8"/>
  <text x="484" y="712" font-size="32" font-weight="bold" text-anchor="middle" fill="#000000" fill-opacity="0.8">Domain Model</text>

  <rect x="676" y="652" width="224" height="96" rx="4" fill="#FFA629" stroke="#CF7300" stroke-width="8"/>
  <text x="788" y="712" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">Repository</text>

  <!-- Persistence -->
  <rect x="260" y="900" width="448" height="240" rx="12" fill="#FFC7C2" stroke="#FF735E" stroke-width="8"/>
  <text x="484" y="1032" font-size="32" font-weight="bold" text-anchor="middle" fill="#000000" fill-opacity="0.8">Persistence</text>

  <!-- Services call the repository -->
  <path d="M722,380 H748 A40,40 0 0 1 788,420 V488" fill="none" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round"/>
  <text x="788" y="542" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">calls</text>
  <line x1="788" y1="571" x2="788" y2="638" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" marker-end="url(#grey)"/>

  <!-- Persistence implements the repository -->
  <line x1="788" y1="825" x2="788" y2="767" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" marker-end="url(#grey-filled)"/>
  <text x="788" y="878" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">implements</text>
  <path d="M788,908 V980 A40,40 0 0 1 748,1020 H722" fill="none" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round"/>
</svg>
