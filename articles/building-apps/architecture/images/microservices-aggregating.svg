<svg xmlns="http://www.w3.org/2000/svg" width="2215" height="1736" viewBox="0 0 2215 1736" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source of microservices-aggregating.png. After editing, regenerate the PNG from this directory with:
       rsvg-convert -w 2215 microservices-aggregating.svg -o microservices-aggregating.png -->
  <defs>
    <marker id="grey" markerUnits="userSpaceOnUse" viewBox="-22 -22 26 44" markerWidth="26" markerHeight="44" orient="auto">
      <path d="M-18,-18 L0,0 L-18,18" fill="none" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
