<svg xmlns="http://www.w3.org/2000/svg" width="2104" height="760" viewBox="0 0 2104 760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source of external-system-integration.png. After editing, regenerate the PNG from this directory with:
       rsvg-convert -w 2104 external-system-integration.svg -o external-system-integration.png -->
  <defs>
    <marker id="purple" markerUnits="userSpaceOnUse" viewBox="-34 -24 38 48" markerWidth="38" markerHeight="48" orient="auto">
      <path d="M0,0 L-30,-16 L-30,16 Z" fill="#D577FF" stroke="#D577FF" stroke-width="8" stroke-linejoin="round"/>
    </marker>
    <marker id="purple-open" markerUnits="userSpaceOnUse" viewBox="-30 -30 34 60" markerWidth="34" markerHeight="60" orient="auto">
      <path d="M-26,-26 L0,0 L-26,26" fill="none" stroke="#D577FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Application -->
  <rect x="260" y="260" width="448" height="240" rx="12" fill="#AFF4C6" stroke="#65BF8C" stroke-width="8"/>
  <text x="484" y="392" font-size="32" font-weight="bold" text-anchor="middle" fill="#000000" fill-opacity="0.8">Application</text>

  <rect x="644" y="348" width="128" height="64" rx="4" fill="#14AE5C" stroke="#006437" stroke-width="8"/>
  <text x="708" y="392" font-size="32" text-anchor="middle" fill="#FFFFFF">SPI</text>

  <!-- Integration -->
  <rect x="900" y="260" width="448" height="240" rx="12" fill="#E4CCFF" stroke="#D577FF" stroke-width="8"/>
  <text x="1124" y="392" font-size="32" font-weight="bold" text-anchor="middle" fill="#000000" fill-opacity="0.8">Integration</text>

  <!-- External System -->
  <rect x="1524" y="260" width="320" height="240" rx="12" fill="#FFE0C2"/>
  <!-- Dashed border: one path per side, from corner to corner, with a dash pattern that fits each side
       a whole number of times. Each side starts and ends with half a dash, so every corner is covered. -->
  <g fill="none" stroke="#FF9E42" stroke-width="8" stroke-linecap="round">
    <path d="M1527.51,263.51 A12,12 0 0 1 1536,260 H1832 A12,12 0 0 1 1840.49,263.51" stroke-dasharray="32.47 20" stroke-dashoffset="16.24"/>
    <path d="M1840.49,263.51 A12,12 0 0 1 1844,272 V488 A12,12 0 0 1 1840.49,496.49" stroke-dasharray="38.71 20" stroke-dashoffset="19.36"/>
    <path d="M1840.49,496.49 A12,12 0 0 1 1832,500 H1536 A12,12 0 0 1 1527.51,496.49" stroke-dasharray="32.47 20" stroke-dashoffset="16.24"/>
    <path d="M1527.51,496.49 A12,12 0 0 1 1524,488 V272 A12,12 0 0 1 1527.51,263.51" stroke-dasharray="38.71 20" stroke-dashoffset="19.36"/>
  </g>
  <text x="1684" y="392" font-size="32" font-weight="bold" text-anchor="middle" fill="#000000" fill-opacity="0.8">External System</text>

  <!-- Arrows -->
  <line x1="884" y1="380" x2="790" y2="380" stroke="#D577FF" stroke-width="8" stroke-linecap="round" marker-end="url(#purple)"/>
  <line x1="1364" y1="380" x2="1507" y2="380" stroke="#D577FF" stroke-width="8" stroke-linecap="round" marker-end="url(#purple-open)"/>
</svg>
