<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="760" viewBox="0 0 2000 760" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source of component-architecture.png. After editing, regenerate the PNG from this directory with:
       rsvg-convert -w 2000 component-architecture.svg -o component-architecture.png -->
  <defs>
    <marker id="blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1E96F0" stroke-width="2"/>
    </marker>
    <marker id="dark" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#222222" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="2000" height="760" fill="#FFFFFF"/>

  <!-- Browser -->
  <rect x="40" y="40" width="900" height="440" rx="14" fill="#E6E6E6" stroke="#C4C4C4" stroke-width="6"/>
  <text x="490" y="88" font-size="30" text-anchor="middle" fill="#222222">Browser</text>

  <rect x="90" y="140" width="360" height="290" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="270" y="262" font-size="28" text-anchor="middle" fill="#FFFFFF">&lt;vaadin-button&gt;</text>
  <text x="270" y="298" font-size="28" text-anchor="middle" fill="#FFFFFF">web component</text>
  <text x="270" y="334" font-size="22" text-anchor="middle" fill="#FFFFFF">in the DOM</text>

  <rect x="530" y="140" width="360" height="100" rx="6" fill="#AAAAAA" stroke="#7A7A7A" stroke-width="6"/>
  <text x="710" y="200" font-size="28" text-anchor="middle" fill="#222222">Flow client engine</text>

  <rect x="530" y="330" width="360" height="100" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="710" y="375" font-size="25" text-anchor="middle" fill="#FFFFFF">React view, with &lt;Button&gt;</text>
  <text x="710" y="409" font-size="19" text-anchor="middle" fill="#FFFFFF">from @vaadin/react-components</text>

    <rect x="40" y="530" width="1420" height="200" rx="14" fill="#F5F5F5" stroke="#C4C4C4" stroke-width="6" stroke-dasharray="18 12"/>
  <text x="750" y="578" font-size="30" text-anchor="middle" fill="#222222">Build time</text>
  <rect x="90" y="600" width="360" height="100" rx="6" fill="#FFFFFF" stroke="#7A7A7A" stroke-width="6"/>
  <text x="270" y="643" font-size="24" text-anchor="middle" fill="#222222">JavaScript of the component,</text>
  <text x="270" y="675" font-size="24" text-anchor="middle" fill="#222222">in the frontend bundle</text>

  <line x1="525" y1="190" x2="457" y2="190" stroke="#1E96F0" stroke-width="5" marker-start="url(#blue)" marker-end="url(#blue)"/>
  <line x1="525" y1="380" x2="457" y2="380" stroke="#1E96F0" stroke-width="5" marker-end="url(#blue)"/>
  <line x1="270" y1="595" x2="270" y2="437" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>
  <text x="290" y="512" font-size="20" fill="#222222">Loaded with the page, defines the element</text>

  <!-- Server -->
  <rect x="980" y="40" width="980" height="440" rx="14" fill="#B3B3B3" stroke="#7F7F7F" stroke-width="6"/>
  <text x="1470" y="88" font-size="30" text-anchor="middle" fill="#222222">Server (Java)</text>

  <rect x="1030" y="140" width="260" height="100" rx="6" fill="#AAAAAA" stroke="#7A7A7A" stroke-width="6"/>
  <text x="1160" y="185" font-size="28" text-anchor="middle" fill="#222222">Element</text>
  <text x="1160" y="217" font-size="22" text-anchor="middle" fill="#222222">&lt;vaadin-button&gt;</text>

  <rect x="1370" y="140" width="260" height="100" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="1500" y="185" font-size="28" text-anchor="middle" fill="#FFFFFF">Button</text>
  <text x="1500" y="217" font-size="22" text-anchor="middle" fill="#FFFFFF">Java component</text>

  <rect x="1710" y="140" width="210" height="100" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="1815" y="185" font-size="28" text-anchor="middle" fill="#FFFFFF">Your</text>
  <text x="1815" y="217" font-size="28" text-anchor="middle" fill="#FFFFFF">Flow view</text>

  <rect x="1370" y="330" width="260" height="100" rx="6" fill="#C9E3F6" stroke="#5BC2F7" stroke-width="6"/>
  <text x="1500" y="372" font-size="20" text-anchor="middle" fill="#222222" font-family="Menlo, DejaVu Sans Mono, monospace">@Tag, @NpmPackage,</text>
  <text x="1500" y="402" font-size="20" text-anchor="middle" fill="#222222" font-family="Menlo, DejaVu Sans Mono, monospace">@JsModule</text>

  <line x1="895" y1="190" x2="1022" y2="190" stroke="#1E96F0" stroke-width="5" marker-start="url(#blue)" marker-end="url(#blue)"/>
  <line x1="1295" y1="190" x2="1362" y2="190" stroke="#1E96F0" stroke-width="5" marker-start="url(#blue)" marker-end="url(#blue)"/>
  <line x1="1705" y1="190" x2="1637" y2="190" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>
  <line x1="1500" y1="245" x2="1500" y2="325" stroke="#5BC2F7" stroke-width="5" stroke-dasharray="10 8"/>
  <text x="1520" y="292" font-size="20" fill="#222222">Annotations on the class</text>

  <path d="M1500,435 L1500,650 L458,650" fill="none" stroke="#222222" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#dark)"/>
  <text x="955" y="638" font-size="22" text-anchor="middle" fill="#222222">Tell the build which JavaScript to bundle</text>
</svg>
