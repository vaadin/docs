<svg xmlns="http://www.w3.org/2000/svg" width="2119" height="1768" viewBox="0 0 2119 1768" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source of microservices-dedicated.png. After editing, regenerate the PNG from this directory with:
       rsvg-convert -w 2119 microservices-dedicated.svg -o microservices-dedicated.png -->
  <defs>
    <marker id="grey" markerUnits="userSpaceOnUse" viewBox="-22 -22 26 44" markerWidth="26" markerHeight="44" orient="auto">
      <path d="M-18,-18 L0,0 L-18,18" fill="none" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Users -->
  <g fill="#E4CCFF" stroke="#D577FF" stroke-width="8">
    <ellipse cx="548" cy="308" rx="56" ry="48"/>
    <rect x="324" y="356" width="448" height="160" rx="12"/>
    <ellipse cx="1060" cy="308" rx="56" ry="48"/>
    <rect x="836" y="356" width="448" height="160" rx="12"/>
    <ellipse cx="1572" cy="308" rx="56" ry="48"/>
    <rect x="1348" y="356" width="448" height="160" rx="12"/>
  </g>
  <g font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">
    <text x="548" y="424" font-weight="bold">Sales representative</text>
    <text x="548" y="472" font-size="34">[person]</text>
    <text x="1060" y="424" font-weight="bold">Accountant</text>
    <text x="1060" y="472" font-size="34">[person]</text>
    <text x="1572" y="424" font-weight="bold">Warehouse worker</text>
    <text x="1572" y="472" font-size="34">[person]</text>
  </g>

  <!-- Services -->
  <rect x="324" y="612" width="448" height="224" rx="12" fill="#AFF4C6" stroke="#65BF8C" stroke-width="8"/>
  <rect x="836" y="612" width="448" height="224" rx="12" fill="#FFE8A3" stroke="#DDBC00" stroke-width="8"/>
  <rect x="1348" y="612" width="448" height="224" rx="12" fill="#BDE3FF" stroke="#22B3FF" stroke-width="8"/>
  <g font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">
    <text x="548" y="711" font-weight="bold">Order Service</text>
    <text x="548" y="759" font-size="34">[Container: Vaadin App]</text>
    <text x="1060" y="711" font-weight="bold">Invoice Service</text>
    <text x="1060" y="759" font-size="34">[Container: Vaadin App]</text>
    <text x="1572" y="711" font-weight="bold">Shipping Service</text>
    <text x="1572" y="759" font-size="34">[Container: Vaadin App]</text>
  </g>

  <!-- Databases -->
  <g stroke-width="8">
    <path d="M324,1012 V1204 A224,48 0 0 0 772,1204 V1012" fill="#14AE5C" stroke="#006437"/>
    <ellipse cx="548" cy="1012" rx="224" ry="48" fill="#14AE5C" stroke="#006437"/>
    <path d="M836,1012 V1204 A224,48 0 0 0 1284,1204 V1012" fill="#FFCD29" stroke="#EAAB00"/>
    <ellipse cx="1060" cy="1012" rx="224" ry="48" fill="#FFCD29" stroke="#EAAB00"/>
    <path d="M1348,1012 V1204 A224,48 0 0 0 1796,1204 V1012" fill="#0D99FF" stroke="#0059B9"/>
    <ellipse cx="1572" cy="1012" rx="224" ry="48" fill="#0D99FF" stroke="#0059B9"/>
  </g>
  <g font-size="32" text-anchor="middle">
    <text x="548" y="1136" font-weight="bold" fill="#FFFFFF">Order Database</text>
    <text x="548" y="1184" font-size="34" fill="#FFFFFF">[Container: PostgreSQL]</text>
    <text x="1060" y="1136" font-weight="bold" fill="#000000" fill-opacity="0.8">Invoice Database</text>
    <text x="1060" y="1184" font-size="34" fill="#000000" fill-opacity="0.8">[Container: MS SQL]</text>
    <text x="1572" y="1136" font-weight="bold" fill="#FFFFFF">Shipping Database</text>
    <text x="1572" y="1184" font-size="34" fill="#FFFFFF">[Container: MongoDB]</text>
  </g>

  <!-- Event Bus -->
  <path d="M372,1348 H1748 A48,80 0 0 1 1748,1508 H372 A48,80 0 0 1 372,1348 Z" fill="#FFC7C2" stroke="#FF735E" stroke-width="8"/>
  <ellipse cx="1748" cy="1428" rx="48" ry="80" fill="#FFC7C2" stroke="#FF735E" stroke-width="8"/>
  <text x="1020" y="1416" font-size="32" font-weight="bold" text-anchor="middle" fill="#000000" fill-opacity="0.8">Event Bus</text>
  <text x="1020" y="1464" font-size="34" text-anchor="middle" fill="#000000" fill-opacity="0.8">[Container: Apache Kafka]</text>

  <!-- Arrows -->
  <g fill="none" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" marker-end="url(#grey)">
    <path d="M548,526 V602"/>
    <path d="M1060,526 V602"/>
    <path d="M1572,526 V602"/>
    <path d="M548,846 V954"/>
    <path d="M1060,846 V954"/>
    <path d="M1572,846 V954"/>
    <path d="M314,724 H301 A40,40 0 0 0 261,764 V1388 A40,40 0 0 0 301,1428 H314"/>
    <path d="M828,724 A23,23 0 0 0 805,747 V1240 A44,44 0 0 0 849,1284 H1016 A44,44 0 0 1 1060,1328 V1338"/>
    <path d="M1806,724 H1818 A40,40 0 0 1 1858,764 V1388 A40,40 0 0 1 1818,1428 H1806"/>
  </g>
</svg>
