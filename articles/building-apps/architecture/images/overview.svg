<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1060" viewBox="0 0 2000 1060" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source of overview.png. After editing, regenerate the PNG from this directory with:
       rsvg-convert -w 2000 overview.svg -o overview.png -->
  <defs>
    <marker id="blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1E96F0" stroke-width="2"/>
    </marker>
    <marker id="dark" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#222222" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="2000" height="1060" fill="#FFFFFF"/>

  <!-- Browser -->
  <rect x="40" y="40" width="700" height="700" rx="14" fill="#E6E6E6" stroke="#C4C4C4" stroke-width="6"/>
  <text x="390" y="88" font-size="30" text-anchor="middle" fill="#222222">Browser</text>

  <rect x="90" y="230" width="600" height="100" rx="6" fill="#AAAAAA" stroke="#7A7A7A" stroke-width="6"/>
  <text x="390" y="290" font-size="28" text-anchor="middle" fill="#222222">Flow client engine</text>

  <rect x="90" y="400" width="600" height="80" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="390" y="450" font-size="28" text-anchor="middle" fill="#FFFFFF">Vaadin components (web components)</text>

  <rect x="90" y="550" width="600" height="100" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="390" y="610" font-size="28" text-anchor="middle" fill="#FFFFFF">React views (optional)</text>

  <line x1="390" y1="335" x2="390" y2="393" stroke="#1E96F0" stroke-width="5" marker-start="url(#blue)" marker-end="url(#blue)"/>
  <line x1="390" y1="545" x2="390" y2="487" stroke="#1E96F0" stroke-width="5" marker-end="url(#blue)"/>

  <!-- Server -->
  <rect x="780" y="40" width="1180" height="700" rx="14" fill="#B3B3B3" stroke="#7F7F7F" stroke-width="6"/>
  <text x="1370" y="88" font-size="30" text-anchor="middle" fill="#222222">Server (Java)</text>

  <rect x="860" y="120" width="600" height="320" rx="10" fill="#C9E3F6" stroke="#5BC2F7" stroke-width="6"/>
  <text x="1160" y="166" font-size="30" text-anchor="middle" fill="#222222">VaadinSession (one per user)</text>

  <rect x="890" y="195" width="540" height="215" rx="8" fill="#A6D3F5" stroke="#2E9BEA" stroke-width="5"/>
  <text x="1160" y="238" font-size="28" text-anchor="middle" fill="#222222">UI (one per browser tab)</text>

  <rect x="920" y="270" width="480" height="100" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="1160" y="315" font-size="28" text-anchor="middle" fill="#FFFFFF">Flow view and its</text>
  <text x="1160" y="349" font-size="28" text-anchor="middle" fill="#FFFFFF">UI components</text>

  <rect x="1500" y="120" width="420" height="580" rx="10" fill="#17B05C" stroke="#0D6B38" stroke-width="6"/>
  <text x="1710" y="166" font-size="30" text-anchor="middle" fill="#0B2E19">Application Layer</text>

  <rect x="1540" y="250" width="340" height="400" rx="6" fill="#ADF5C8" stroke="#5EC98A" stroke-width="6"/>
  <text x="1710" y="440" font-size="28" text-anchor="middle" fill="#222222">Application</text>
  <text x="1710" y="474" font-size="28" text-anchor="middle" fill="#222222">services</text>

  <!-- Browser to server -->
  <line x1="695" y1="300" x2="912" y2="300" stroke="#1E96F0" stroke-width="5" marker-start="url(#blue)" marker-end="url(#blue)"/>
  <text x="800" y="345" font-size="20" text-anchor="middle" fill="#222222">Events and</text>
  <text x="800" y="372" font-size="20" text-anchor="middle" fill="#222222">UI changes</text>
  <text x="800" y="399" font-size="20" text-anchor="middle" fill="#222222">as JSON</text>

  <line x1="1403" y1="320" x2="1532" y2="320" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>

  <line x1="695" y1="600" x2="1532" y2="600" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>
  <text x="1140" y="580" font-size="24" text-anchor="middle" fill="#222222">Calls to @BrowserCallable services over HTTP</text>

  <!-- Database -->
  <rect x="1500" y="800" width="420" height="120" rx="10" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="6"/>
  <text x="1710" y="852" font-size="28" text-anchor="middle" fill="#222222">Database and</text>
  <text x="1710" y="886" font-size="28" text-anchor="middle" fill="#222222">other systems</text>
  <line x1="1710" y1="655" x2="1710" y2="792" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>

  <!-- Build time -->
  <rect x="40" y="800" width="1420" height="220" rx="14" fill="#F5F5F5" stroke="#C4C4C4" stroke-width="6" stroke-dasharray="18 12"/>
  <text x="750" y="848" font-size="30" text-anchor="middle" fill="#222222">Build time</text>

  <rect x="90" y="880" width="600" height="100" rx="6" fill="#AAAAAA" stroke="#7A7A7A" stroke-width="6"/>
  <text x="390" y="940" font-size="28" text-anchor="middle" fill="#222222">Frontend bundle</text>

  <rect x="820" y="880" width="600" height="100" rx="6" fill="#AAAAAA" stroke="#7A7A7A" stroke-width="6"/>
  <text x="1120" y="925" font-size="28" text-anchor="middle" fill="#222222">Vaadin Maven or Gradle</text>
  <text x="1120" y="959" font-size="28" text-anchor="middle" fill="#222222">plugin, with Vite</text>

  <line x1="815" y1="930" x2="698" y2="930" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>
  <line x1="390" y1="875" x2="390" y2="748" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>
  <text x="410" y="782" font-size="22" fill="#222222">Loaded when the page opens</text>
</svg>
