<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1060" viewBox="0 0 2000 1060" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source of overview.png. After editing, regenerate the PNG from this directory with:
       rsvg-convert -w 2000 overview.svg -o overview.png -->
  <defs>
    <marker id="blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1E96F0" stroke-width="2"/>
    </marker>
    <marker id="dark" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#222222" stroke-width="2"/>
    </marker>
  </defs>
  <rect width="2000" height="1060" fill="#FFFFFF"/>

  <!-- Browser -->
  <rect x="40" y="40" width="660" height="700" rx="14" fill="#E6E6E6" stroke="#C4C4C4" stroke-width="6"/>
  <text x="370" y="88" font-size="30" text-anchor="middle" fill="#222222">Browser</text>

  <rect x="90" y="300" width="560" height="110" rx="6" fill="#AAAAAA" stroke="#7A7A7A" stroke-width="6"/>
  <text x="370" y="365" font-size="28" text-anchor="middle" fill="#222222">Vaadin client engine</text>

  <rect x="90" y="470" width="560" height="80" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="370" y="520" font-size="28" text-anchor="middle" fill="#FFFFFF">Vaadin components (web components)</text>

  <rect x="90" y="610" width="560" height="100" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="370" y="670" font-size="28" text-anchor="middle" fill="#FFFFFF">Your React views (optional)</text>

  <line x1="370" y1="415" x2="370" y2="463" stroke="#1E96F0" stroke-width="5" marker-start="url(#blue)" marker-end="url(#blue)"/>
  <line x1="370" y1="605" x2="370" y2="557" stroke="#1E96F0" stroke-width="5" marker-end="url(#blue)"/>

  <!-- Server -->
  <rect x="840" y="40" width="1120" height="700" rx="14" fill="#B3B3B3" stroke="#7F7F7F" stroke-width="6"/>
  <text x="1400" y="88" font-size="30" text-anchor="middle" fill="#222222">Server (JVM)</text>

  <rect x="880" y="120" width="620" height="350" rx="10" fill="#C9E3F6" stroke="#5BC2F7" stroke-width="6"/>
  <text x="1190" y="166" font-size="30" text-anchor="middle" fill="#222222">VaadinSession</text>
  <text x="1190" y="200" font-size="25" text-anchor="middle" fill="#555555">One per user and browser</text>

  <rect x="920" y="230" width="540" height="210" rx="8" fill="#A6D3F5" stroke="#2E9BEA" stroke-width="5"/>
  <text x="1190" y="274" font-size="28" text-anchor="middle" fill="#222222">UI (one per browser tab)</text>

  <rect x="960" y="300" width="460" height="110" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="1190" y="347" font-size="28" text-anchor="middle" fill="#FFFFFF">Your Java view and</text>
  <text x="1190" y="381" font-size="28" text-anchor="middle" fill="#FFFFFF">its UI components</text>

  <rect x="1580" y="120" width="340" height="590" rx="10" fill="#17B05C" stroke="#0D6B38" stroke-width="6"/>
  <text x="1750" y="166" font-size="30" text-anchor="middle" fill="#0B2E19">Application Layer</text>

  <rect x="1620" y="300" width="260" height="370" rx="6" fill="#ADF5C8" stroke="#5EC98A" stroke-width="6"/>
  <text x="1750" y="478" font-size="28" text-anchor="middle" fill="#222222">Your application</text>
  <text x="1750" y="512" font-size="28" text-anchor="middle" fill="#222222">services</text>

  <!-- Browser to server -->
  <line x1="655" y1="355" x2="952" y2="355" stroke="#1E96F0" stroke-width="5" marker-start="url(#blue)" marker-end="url(#blue)"/>
  <text x="770" y="402" font-size="22" text-anchor="middle" fill="#222222">Events and</text>
  <text x="770" y="430" font-size="22" text-anchor="middle" fill="#222222">UI changes</text>
  <text x="770" y="458" font-size="22" text-anchor="middle" fill="#222222">as JSON</text>

  <line x1="1423" y1="355" x2="1612" y2="355" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>

  <line x1="655" y1="650" x2="1612" y2="650" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>
  <text x="1210" y="628" font-size="24" text-anchor="middle" fill="#222222">Calls to @BrowserCallable services over HTTP</text>

  <!-- Database -->
  <rect x="1580" y="800" width="340" height="120" rx="6" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="6"/>
  <text x="1750" y="852" font-size="28" text-anchor="middle" fill="#222222">Database and</text>
  <text x="1750" y="886" font-size="28" text-anchor="middle" fill="#222222">other systems</text>
  <line x1="1750" y1="675" x2="1750" y2="792" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>

  <!-- Build time -->
  <rect x="40" y="800" width="1460" height="220" rx="14" fill="#F5F5F5" stroke="#C4C4C4" stroke-width="6" stroke-dasharray="18 12"/>
  <text x="770" y="848" font-size="30" text-anchor="middle" fill="#222222">Build time</text>

  <rect x="90" y="880" width="560" height="100" rx="6" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="6"/>
  <text x="370" y="940" font-size="28" text-anchor="middle" fill="#222222">Frontend bundle</text>

  <rect x="840" y="880" width="600" height="100" rx="6" fill="#FFFFFF" stroke="#7F7F7F" stroke-width="6"/>
  <text x="1140" y="925" font-size="28" text-anchor="middle" fill="#222222">Vaadin Maven or Gradle</text>
  <text x="1140" y="959" font-size="28" text-anchor="middle" fill="#222222">plugin, with Vite</text>

  <line x1="835" y1="930" x2="658" y2="930" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>
  <line x1="370" y1="875" x2="370" y2="748" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>
  <text x="392" y="779" font-size="22" fill="#222222">Loaded when the page opens</text>
</svg>
