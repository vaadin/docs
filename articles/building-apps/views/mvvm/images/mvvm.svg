<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="700" viewBox="0 0 2000 700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source of mvvm.png. After editing, regenerate the PNG from this directory with:
       rsvg-convert -w 2000 mvvm.svg -o mvvm.png -->
  <defs>
    <marker id="blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#1E96F0" stroke-width="2"/>
    </marker>
    <marker id="dark" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#222222" stroke-width="2"/>
    </marker>
  </defs>

  <!-- UI layer -->
  <rect x="40" y="40" width="1440" height="620" rx="14" fill="#C9E3F6" stroke="#5BC2F7" stroke-width="6"/>
  <text x="760" y="88" font-size="30" text-anchor="middle" fill="#222222">UI Layer</text>

  <!-- View -->
  <rect x="80" y="120" width="440" height="500" rx="10" fill="#A6D3F5" stroke="#2E9BEA" stroke-width="5"/>
  <text x="300" y="166" font-size="30" text-anchor="middle" fill="#222222">View</text>

  <rect x="120" y="215" width="360" height="90" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="300" y="270" font-size="28" text-anchor="middle" fill="#FFFFFF">Title field</text>

  <rect x="120" y="355" width="360" height="230" rx="6" fill="#0D96FF" stroke="#0057B8" stroke-width="6"/>
  <text x="300" y="480" font-size="28" text-anchor="middle" fill="#FFFFFF">Save button</text>

  <!-- ViewModel -->
  <rect x="620" y="120" width="820" height="500" rx="10" fill="#A6D3F5" stroke="#2E9BEA" stroke-width="5"/>
  <text x="1030" y="166" font-size="30" text-anchor="middle" fill="#222222">ViewModel</text>

  <rect x="660" y="215" width="320" height="90" rx="6" fill="#FFFFFF" stroke="#2E9BEA" stroke-width="5"/>
  <text x="820" y="255" font-size="28" text-anchor="middle" fill="#222222">setTitle()</text>
  <text x="820" y="288" font-size="22" text-anchor="middle" fill="#555555">command</text>

  <rect x="1080" y="215" width="320" height="90" rx="6" fill="#FFFFFF" stroke="#2E9BEA" stroke-width="5"/>
  <text x="1240" y="255" font-size="28" text-anchor="middle" fill="#222222">draft</text>
  <text x="1240" y="288" font-size="22" text-anchor="middle" fill="#555555">signal</text>

  <rect x="1080" y="355" width="320" height="90" rx="6" fill="#FFFFFF" stroke="#2E9BEA" stroke-width="5"/>
  <text x="1240" y="395" font-size="28" text-anchor="middle" fill="#222222">canSave</text>
  <text x="1240" y="428" font-size="22" text-anchor="middle" fill="#555555">derived signal</text>

  <rect x="660" y="495" width="320" height="90" rx="6" fill="#FFFFFF" stroke="#2E9BEA" stroke-width="5"/>
  <text x="820" y="535" font-size="28" text-anchor="middle" fill="#222222">save()</text>
  <text x="820" y="568" font-size="22" text-anchor="middle" fill="#555555">command</text>

  <!-- Model -->
  <rect x="1540" y="40" width="420" height="620" rx="14" fill="#17B05C" stroke="#0D6B38" stroke-width="6"/>
  <text x="1750" y="88" font-size="30" text-anchor="middle" fill="#0B2E19">Model</text>

  <rect x="1580" y="495" width="340" height="90" rx="6" fill="#ADF5C8" stroke="#5EC98A" stroke-width="6"/>
  <text x="1750" y="550" font-size="28" text-anchor="middle" fill="#222222">TicketService</text>

  <!-- Arrows -->
  <line x1="483" y1="260" x2="652" y2="260" stroke="#1E96F0" stroke-width="5" marker-end="url(#blue)"/>
  <line x1="983" y1="260" x2="1072" y2="260" stroke="#1E96F0" stroke-width="5" marker-end="url(#blue)"/>
  <line x1="1240" y1="308" x2="1240" y2="347" stroke="#1E96F0" stroke-width="5" marker-end="url(#blue)"/>
  <line x1="1077" y1="400" x2="488" y2="400" stroke="#1E96F0" stroke-width="5" marker-end="url(#blue)"/>
  <text x="800" y="438" font-size="22" text-anchor="middle" fill="#0057B8">binding</text>
  <line x1="483" y1="540" x2="652" y2="540" stroke="#1E96F0" stroke-width="5" marker-end="url(#blue)"/>
  <line x1="983" y1="540" x2="1572" y2="540" stroke="#222222" stroke-width="5" marker-end="url(#dark)"/>

  <!-- Step numbers -->
  <g font-size="24" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    <circle cx="567" cy="218" r="22" fill="#222222"/>
    <text x="567" y="226">1</text>
    <circle cx="1030" cy="218" r="22" fill="#222222"/>
    <text x="1030" y="226">2</text>
    <circle cx="1290" cy="331" r="22" fill="#222222"/>
    <text x="1290" y="339">3</text>
    <circle cx="800" cy="358" r="22" fill="#222222"/>
    <text x="800" y="366">4</text>
    <circle cx="567" cy="498" r="22" fill="#222222"/>
    <text x="567" y="506">5</text>
    <circle cx="1240" cy="498" r="22" fill="#222222"/>
    <text x="1240" y="506">6</text>
  </g>
</svg>
