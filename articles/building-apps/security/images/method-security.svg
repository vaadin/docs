<svg xmlns="http://www.w3.org/2000/svg" width="2084" height="908" viewBox="0 0 2084 908" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source of method-security.png. After editing, regenerate the PNG from this directory with:
       rsvg-convert -w 2084 method-security.svg -o method-security.png -->
  <defs>
    <marker id="green" markerUnits="userSpaceOnUse" viewBox="-29 -29 32 58" markerWidth="32" markerHeight="58" orient="auto">
      <path d="M-26,-26 L0,0 L-26,26" fill="none" stroke="#3E9B4B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="purple" markerUnits="userSpaceOnUse" viewBox="-29 -29 32 58" markerWidth="32" markerHeight="58" orient="auto">
      <path d="M-26,-26 L0,0 L-26,26" fill="none" stroke="#874FFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="red" markerUnits="userSpaceOnUse" viewBox="-29 -29 32 58" markerWidth="32" markerHeight="58" orient="auto">
      <path d="M-26,-26 L0,0 L-26,26" fill="none" stroke="#BD2915" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <!-- Icons from Feather (MIT license), drawn on a 24x24 grid. Stroke colour and width come from the <use> element. -->
    <g id="monitor" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="20" height="14" rx="2"/>
      <path d="M8,21 H16 M12,17 V21"/>
    </g>
    <g id="box" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
      <path d="M3.27 6.96 L12 12.01 L20.73 6.96 M12 22.08 V12"/>
    </g>
    <g id="shield" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </g>
  </defs>

  <!-- Flow View -->
  <rect x="259" y="259" width="254" height="390" rx="12" fill="#CDF4D3" stroke="#66D575" stroke-width="6"/>
  <use href="#monitor" transform="translate(316.4 312.6) scale(5.8)" stroke="#66D575" stroke-width="1.03"/>
  <text x="386" y="501" font-size="32" font-weight="500" text-anchor="middle" fill="#1E1E1E">Flow View</text>

  <!-- Proxy -->
  <rect x="675" y="259" width="254" height="390" rx="12" fill="#DCCCFF" stroke="#874FFF" stroke-width="6"/>
  <use href="#box" transform="translate(738.64 319.44) scale(5.28)" stroke="#874FFF" stroke-width="1.14"/>
  <text x="802" y="501" font-size="32" font-weight="500" text-anchor="middle" fill="#1E1E1E">Proxy</text>

  <!-- Method Security Interceptor -->
  <rect x="1123" y="259" width="254" height="390" rx="12" fill="#FFC7C2" stroke="#F24822" stroke-width="6"/>
  <use href="#shield" transform="translate(1187 317.5) scale(5.25)" stroke="#F24822" stroke-width="1.14"/>
  <text x="1250" y="501" font-size="32" font-weight="500" text-anchor="middle" fill="#1E1E1E">Method</text>
  <text x="1250" y="538" font-size="32" font-weight="500" text-anchor="middle" fill="#1E1E1E">Security</text>
  <text x="1250" y="575" font-size="32" font-weight="500" text-anchor="middle" fill="#1E1E1E">Interceptor</text>

  <!-- Your Service -->
  <rect x="1571" y="259" width="254" height="390" rx="12" fill="#C2E5FF" stroke="#3DADFF" stroke-width="6"/>
  <use href="#box" transform="translate(1634.64 319.44) scale(5.28)" stroke="#3DADFF" stroke-width="1.14"/>
  <text x="1698" y="501" font-size="32" font-weight="500" text-anchor="middle" fill="#1E1E1E">Your Service</text>

  <!-- Arrows -->
  <line x1="527" y1="454" x2="660" y2="454" stroke="#3E9B4B" stroke-width="6" stroke-linecap="round" marker-end="url(#green)"/>
  <line x1="943" y1="454" x2="1108" y2="454" stroke="#874FFF" stroke-width="6" stroke-linecap="round" marker-end="url(#purple)"/>
  <line x1="1391" y1="454" x2="1556" y2="454" stroke="#BD2915" stroke-width="6" stroke-linecap="round" marker-end="url(#red)"/>
</svg>
