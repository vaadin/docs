<svg xmlns="http://www.w3.org/2000/svg" width="1896" height="906" viewBox="0 0 1896 906" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source of declarative-transactions.png. After editing, regenerate the PNG from this directory with:
       rsvg-convert -w 1896 declarative-transactions.svg -o declarative-transactions.png -->
  <defs>
    <marker id="grey" markerUnits="userSpaceOnUse" viewBox="-30 -30 34 60" markerWidth="34" markerHeight="60" orient="auto">
      <path d="M-26,-26 L0,0 L-26,26" fill="none" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="red" markerUnits="userSpaceOnUse" viewBox="-30 -30 34 60" markerWidth="34" markerHeight="60" orient="auto">
      <path d="M-26,-26 L0,0 L-26,26" fill="none" stroke="#F24822" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Transaction Manager -->
  <rect x="1028" y="260" width="224" height="130" rx="12" fill="#E6E6E6" stroke="#B6B6B6" stroke-width="8"/>
  <text x="1140" y="313" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">Transaction</text>
  <text x="1140" y="361" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">Manager</text>

  <!-- Client -->
  <rect x="260" y="516" width="224" height="130" rx="12" fill="#BDE3FF" stroke="#22B3FF" stroke-width="8"/>
  <text x="372" y="593" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">Client</text>

  <!-- Proxy. The dashed border has one path per side, from corner to corner, with a dash pattern that fits
       each side a whole number of times. Each side starts and ends with half a dash, so every corner is covered. -->
  <rect x="644" y="516" width="224" height="130" rx="12" fill="#14AE5C"/>
  <g fill="none" stroke="#006437" stroke-width="8" stroke-linecap="round">
    <path d="M647.51,519.51 A12,12 0 0 1 656,516 H856 A12,12 0 0 1 864.49,519.51" stroke-dasharray="34.71 20" stroke-dashoffset="17.36"/>
    <path d="M864.49,519.51 A12,12 0 0 1 868,528 V634 A12,12 0 0 1 864.49,642.49" stroke-dasharray="42.42 20" stroke-dashoffset="21.21"/>
    <path d="M864.49,642.49 A12,12 0 0 1 856,646 H656 A12,12 0 0 1 647.51,642.49" stroke-dasharray="34.71 20" stroke-dashoffset="17.36"/>
    <path d="M647.51,642.49 A12,12 0 0 1 644,634 V528 A12,12 0 0 1 647.51,519.51" stroke-dasharray="42.42 20" stroke-dashoffset="21.21"/>
  </g>
  <text x="756" y="593" font-size="32" text-anchor="middle" fill="#FFFFFF">Proxy</text>

  <!-- Interceptor -->
  <rect x="1028" y="516" width="224" height="130" rx="12" fill="#FFE8A3" stroke="#DDBC00" stroke-width="8"/>
  <text x="1140" y="593" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">Interceptor</text>

  <!-- Service -->
  <rect x="1412" y="516" width="224" height="130" rx="12" fill="#AFF4C6" stroke="#65BF8C" stroke-width="8"/>
  <text x="1524" y="593" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">Service</text>

  <!-- Arrows -->
  <line x1="500" y1="581" x2="627" y2="581" stroke="#F24822" stroke-width="8" stroke-linecap="round" marker-end="url(#red)"/>
  <line x1="884" y1="581" x2="1010" y2="581" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" marker-end="url(#grey)"/>
  <line x1="1140" y1="500" x2="1140" y2="407" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" marker-end="url(#grey)"/>
  <line x1="1268" y1="581" x2="1394" y2="581" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" marker-end="url(#grey)"/>
</svg>
