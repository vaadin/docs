<svg xmlns="http://www.w3.org/2000/svg" width="1608" height="1000" viewBox="0 0 1608 1000" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- Source of declarative-transactions-self-call.png. After editing, regenerate the PNG from this directory with:
       rsvg-convert -w 1608 declarative-transactions-self-call.svg -o declarative-transactions-self-call.png -->
  <defs>
    <marker id="grey" markerUnits="userSpaceOnUse" viewBox="-30 -30 34 60" markerWidth="34" markerHeight="60" orient="auto">
      <path d="M-26,-26 L0,0 L-26,26" fill="none" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="red" markerUnits="userSpaceOnUse" viewBox="-30 -30 34 60" markerWidth="34" markerHeight="60" orient="auto">
      <path d="M-26,-26 L0,0 L-26,26" fill="none" stroke="#F24822" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Transaction Manager -->
  <rect x="644" y="260" width="224" height="130" rx="12" fill="#E6E6E6" stroke="#B6B6B6" stroke-width="8"/>
  <text x="756" y="313" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">Transaction</text>
  <text x="756" y="361" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">Manager</text>

  <!-- Proxy. The dashed border has one path per side, from corner to corner, with a dash pattern that fits
       each side a whole number of times. Each side starts and ends with half a dash, so every corner is covered. -->
  <rect x="260" y="516" width="224" height="130" rx="12" fill="#14AE5C"/>
  <g fill="none" stroke="#006437" stroke-width="8" stroke-linecap="round">
    <path d="M263.51,519.51 A12,12 0 0 1 272,516 H472 A12,12 0 0 1 480.49,519.51" stroke-dasharray="34.71 20" stroke-dashoffset="17.36"/>
    <path d="M480.49,519.51 A12,12 0 0 1 484,528 V634 A12,12 0 0 1 480.49,642.49" stroke-dasharray="42.42 20" stroke-dashoffset="21.21"/>
    <path d="M480.49,642.49 A12,12 0 0 1 472,646 H272 A12,12 0 0 1 263.51,642.49" stroke-dasharray="34.71 20" stroke-dashoffset="17.36"/>
    <path d="M263.51,642.49 A12,12 0 0 1 260,634 V528 A12,12 0 0 1 263.51,519.51" stroke-dasharray="42.42 20" stroke-dashoffset="21.21"/>
  </g>
  <text x="372" y="593" font-size="32" text-anchor="middle" fill="#FFFFFF">Proxy</text>

  <!-- Interceptor -->
  <rect x="644" y="516" width="224" height="130" rx="12" fill="#FFE8A3" stroke="#DDBC00" stroke-width="8"/>
  <text x="756" y="593" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">Interceptor</text>

  <!-- Service -->
  <rect x="1028" y="516" width="224" height="130" rx="12" fill="#AFF4C6" stroke="#65BF8C" stroke-width="8"/>
  <text x="1140" y="593" font-size="32" text-anchor="middle" fill="#000000" fill-opacity="0.8">Service</text>

  <!-- Arrows -->
  <line x1="500" y1="581" x2="627" y2="581" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" marker-end="url(#grey)"/>
  <line x1="756" y1="500" x2="756" y2="407" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" marker-end="url(#grey)"/>
  <line x1="884" y1="581" x2="1010" y2="581" stroke="#B3B3B3" stroke-width="8" stroke-linecap="round" marker-end="url(#grey)"/>
  <path d="M1268,581 H1300 A48,48 0 0 1 1348,629 V692 A48,48 0 0 1 1300,740 H1188 A48,48 0 0 1 1140,692 V663" fill="none" stroke="#F24822" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#red)"/>
</svg>
