extends: existence
message: "Call it a 'browser-callable service', not '%s'. A service exposed to the browser used to be called an endpoint, which collides with the REST endpoints the term normally means."
link: https://vaadin.com/docs/latest/building-apps/react/call-services
level: warning
ignorecase: false
vocab: false
# The Java and TypeScript APIs keep the old names -- @Endpoint, EndpointException,
# Frontend/generated/endpoints, and similar. Those are written in code spans or with
# a [classname], [annotationname], or [filename] role, all of which Vale skips, so
# only prose is flagged.
tokens:
  - '[Ee]ndpoints?'
