extends: existence
message: "Don't send readers to a separate Hilla project ('%s'). Hilla is part of Vaadin: there is one kind of project -- a Vaadin project -- and browser-callable services and React views are added to it."
link: https://vaadin.com/docs/latest/getting-started
level: error
scope: raw
nonword: true
ignorecase: false
vocab: false
tokens:
  # Wording that presents a Hilla project as something separate from a Vaadin project
  - '\b[Hh]illa projects?\b'
  - '\b(?:[Cc]reat(?:e|ing)|[Dd]ownload(?:ing)?|[Ss]tart(?:ing)?|[Bb]ootstrap(?:ping)?|[Gg]enerat(?:e|ing)) (?:a |an |the )?(?:new |minimal |standard |bare-bones )*[Hh]illa applications?\b'
  # The Hilla CLI is deprecated in favor of 'npm init vaadin'
  - '@hilla/cli'
